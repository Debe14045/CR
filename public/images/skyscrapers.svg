<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Sky Background Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#73A9E4"/>
      <stop offset="40%" stop-color="#9BC4F3"/>
      <stop offset="70%" stop-color="#BEE0FB"/>
      <stop offset="100%" stop-color="#D7ECFD"/>
    </linearGradient>

    <!-- Tower 1: Left Skyscraper (Looking up) -->
    <linearGradient id="towerLeftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D5F9A"/>
      <stop offset="50%" stop-color="#417BBB"/>
      <stop offset="100%" stop-color="#1B3A64"/>
    </linearGradient>
    
    <!-- Tower 2: Center Main Tower -->
    <linearGradient id="towerCenterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3470B2"/>
      <stop offset="50%" stop-color="#5B9DE4"/>
      <stop offset="100%" stop-color="#1E4576"/>
    </linearGradient>

    <!-- Tower 3: Right Tower -->
    <linearGradient id="towerRightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E4273"/>
      <stop offset="50%" stop-color="#3A6FA8"/>
      <stop offset="100%" stop-color="#132B4F"/>
    </linearGradient>

    <!-- Glass Grid Pattern Left -->
    <pattern id="gridLeft" width="24" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(18)">
      <rect width="24" height="12" fill="none"/>
      <line x1="0" y1="0" x2="24" y2="0" stroke="rgba(255,255,255,0.22)" stroke-width="0.8"/>
      <line x1="0" y1="0" x2="0" y2="12" stroke="rgba(255,255,255,0.18)" stroke-width="0.8"/>
      <rect x="2" y="2" width="20" height="8" fill="rgba(255,255,255,0.06)"/>
    </pattern>

    <!-- Glass Grid Pattern Center -->
    <pattern id="gridCenter" width="20" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(2)">
      <rect width="20" height="10" fill="none"/>
      <line x1="0" y1="0" x2="20" y2="0" stroke="rgba(255,255,255,0.3)" stroke-width="0.9"/>
      <line x1="0" y1="0" x2="0" y2="10" stroke="rgba(255,255,255,0.22)" stroke-width="0.9"/>
      <rect x="2" y="2" width="16" height="6" fill="rgba(255,255,255,0.08)"/>
    </pattern>

    <!-- Glass Grid Pattern Right -->
    <pattern id="gridRight" width="22" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(-15)">
      <rect width="22" height="14" fill="none"/>
      <line x1="0" y1="0" x2="22" y2="0" stroke="rgba(255,255,255,0.2)" stroke-width="0.8"/>
      <line x1="0" y1="0" x2="0" y2="14" stroke="rgba(255,255,255,0.16)" stroke-width="0.8"/>
      <rect x="2" y="2" width="18" height="10" fill="rgba(255,255,255,0.05)"/>
    </pattern>

    <!-- Sun flare / lighting -->
    <radialGradient id="sunGlow" cx="65%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#D6E8FF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#73A9E4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Sky Base -->
  <rect width="500" height="700" fill="url(#skyGrad)"/>
  <circle cx="320" cy="200" r="280" fill="url(#sunGlow)"/>

  <!-- Left Skyscraper (angled upwards) -->
  <polygon points="0,120 100,150 120,700 0,700" fill="url(#towerLeftGrad)"/>
  <polygon points="0,120 100,150 120,700 0,700" fill="url(#gridLeft)"/>
  <!-- Left building side shadow -->
  <polygon points="100,150 115,155 135,700 120,700" fill="#183354" opacity="0.7"/>

  <!-- Background Tower (far away) -->
  <polygon points="210,80 245,90 260,700 220,700" fill="#427BB8" opacity="0.6"/>

  <!-- Right Skyscraper (angled inwards) -->
  <polygon points="360,200 480,90 500,700 375,700" fill="url(#towerRightGrad)"/>
  <polygon points="360,200 480,90 500,700 375,700" fill="url(#gridRight)"/>
  <!-- Right edge facet -->
  <polygon points="360,200 375,700 325,700 320,240" fill="#2A598D" opacity="0.85"/>

  <!-- Center Main Skyscraper (Hero tower rising up) -->
  <polygon points="140,250 290,200 315,700 125,700" fill="url(#towerCenterGrad)"/>
  <polygon points="140,250 290,200 315,700 125,700" fill="url(#gridCenter)"/>

  <!-- Sunlight Highlights & Vertical Lines on Center Tower -->
  <line x1="140" y1="250" x2="125" y2="700" stroke="#90C4FF" stroke-width="2.5" opacity="0.8"/>
  <line x1="290" y1="200" x2="315" y2="700" stroke="#FFFFFF" stroke-width="3" opacity="0.9"/>
  <line x1="215" y1="225" x2="220" y2="700" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>

  <!-- Horizon overlay & atmospheric contrast gradient for text clarity -->
  <linearGradient id="overlayVignette" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="rgba(10, 25, 55, 0.25)"/>
    <stop offset="40%" stop-color="rgba(10, 30, 65, 0.35)"/>
    <stop offset="70%" stop-color="rgba(8, 24, 52, 0.65)"/>
    <stop offset="100%" stop-color="rgba(5, 18, 42, 0.85)"/>
  </linearGradient>
  <rect width="500" height="700" fill="url(#overlayVignette)"/>
</svg>
