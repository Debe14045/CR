<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 140" width="130" height="114" fill="none">
  <defs>
    <linearGradient id="cyanPadlockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00BAF2"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="padlockGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0284C7" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#padlockGlow)">
    <!-- Circuit lines on the left -->
    <!-- Top circuit branch -->
    <path d="M 64 68 L 38 68 L 38 60 L 26 60" stroke="#00BAF2" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="24" cy="60" r="5" fill="#00BAF2"/>

    <!-- Middle circuit branch -->
    <path d="M 64 78 L 18 78" stroke="#00BAF2" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="16" cy="78" r="5" fill="#00BAF2"/>

    <!-- Bottom circuit branch -->
    <path d="M 64 88 L 44 88 L 36 96 L 24 96" stroke="#00BAF2" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="22" cy="96" r="5" fill="#00BAF2"/>

    <!-- Padlock Top Shackle -->
    <path d="M 72 60 L 72 40 C 72 25 110 25 110 40 L 110 60" 
          stroke="url(#cyanPadlockGrad)" stroke-width="9" stroke-linecap="round" fill="none"/>

    <!-- Padlock Body (Rounded Rect) -->
    <rect x="64" y="54" width="56" height="50" rx="12" fill="url(#cyanPadlockGrad)"/>

    <!-- Keyhole cutout in White -->
    <circle cx="92" cy="74" r="5.5" fill="#FFFFFF"/>
    <polygon points="89,74 95,74 97,88 87,88" fill="#FFFFFF"/>

    <!-- Subtle circuit node accent at bottom right -->
    <path d="M 120 88 L 132 88" stroke="#00BAF2" stroke-width="4" stroke-linecap="round"/>
    <circle cx="134" cy="88" r="4.5" fill="#00BAF2"/>
  </g>
</svg>
